<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">contact us</p>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Contact us screen start -->
		<div class="verify-email pb-20" id="contact-us-main">
			<div class="container">
				<div class="verify-number-content">
					<div class="verify-number-content mt-16">
						<div class="verify-email-img-sec text-center">
							<div class="main-img-top">
								<img src="assets/images/main-img/contact-us-img.png" alt="notification-img">
							</div>
							<div class="main-img-bottom">
								<img src="assets/images/homescreen/bottom.png" alt="notification-img">
							</div>
						</div>
						<div class="contact-txt mt-32">
							<h1>Contact Us</h1>
							<p class="sm-font-sans fw-400 text-center mt-12">If you face any trouble for item ordering feel free to contact us.
							</p>
						</div>
						<div class="contact-screen">
							<div class="contact-us-mobile-btn mt-32">
								<a href="tel:+12223334455">
									<span>
										<img src="assets/svg/call-icon.svg" alt="call-icon">
									</span>
									<span class="contact-us-no">+1 222 333 4455</span>
								</a>
							</div>
							<div class="contact-us-mobile-btn mt-8">
								<a href="mailto:help@payfast.com">								
									<span>
										<img src="assets/svg/mail-icon.svg" alt="call-icon">
									</span>
									<span class="contact-us-no">help@vigorgym.com</span>
								</a>
							</div>
							<div class="contact-us-mobile-btn mt-8">
								<a href="https://www.google.com/" target="_blank">
									<span>
										<img src="assets/svg/web-icon.svg" alt="call-icon">
									</span>
									<span class="contact-us-no">www.vigorgym.com</span>
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- Contact us screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
