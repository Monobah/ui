<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">Face RECOGNITION</p>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Face recognition process start -->
		<div class="verify-email" id="face-recognition-main">
			<div class="container">
				<div class="finger-print-top mt-16">
					<div class="add-fingerprint">
						<h1 class="d-none">Finger print</h1>
						<p class="sm-font-sans fw-400 text-center">Enable Face ID to let you login & proceed with your transaction faster</p>
					</div>
					<div class="face-img text-center">
						<img src="assets/images/fingerprint/face-recognition-img.png" alt="face-recognition-img">
					</div>
					<div class="finger-print-bottom">
						<div class="loader-content text-center">
							<span id="loader">00 %</span>
							<p class="verify-txt md-font-sans fw-500 color-black mt-24">Verifying your face...</p>
						</div>
					</div> 
				</div>
			</div>
		</div>
		<!-- Face recognition process end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
	<script>
		$(document).ready(function() {
            setTimeout(function() {
                window.location.href = "homescreen.html";
            }, 6000); 
        });
	</script>
</body>
</html>
