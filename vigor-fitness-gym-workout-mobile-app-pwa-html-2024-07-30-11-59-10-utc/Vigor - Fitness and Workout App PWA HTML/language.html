<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">language</p>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Language screen start -->
		<div class="verify-email pb-20" id="language-screen">
			<div class="container">
				<div class="lang-list">
					<h1 class="d-none">Lanuage</h1>
					<div class="form-check change-lan-sec language-sel border-bottom1">
						<input class="form-check-input custom-input" name="language" type="radio" id="language1" checked="">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language1">
							English (US)
						</label>
					</div>
					<div class="form-check change-lan-sec border-bottom1">
						<input class="form-check-input custom-input" name="language" type="radio" id="language2">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language2">
							English (UK)
						</label>
					</div>
					<div class="form-check change-lan-sec border-bottom1">
						<input class="form-check-input custom-input" name="language" type="radio" id="language3">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language3">
							Hindi
						</label>
					</div>
					<div class="form-check change-lan-sec border-bottom1">
						<input class="form-check-input custom-input" name="language" type="radio" id="language4">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language4">
							Spanish
						</label>
					</div>
					<div class="form-check change-lan-sec border-bottom1">
						<input class="form-check-input custom-input" name="language" type="radio" id="language5">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language5">
							French
						</label>
					</div>
					<div class="form-check change-lan-sec border-bottom1">
						<input class="form-check-input custom-input" name="language" type="radio" id="language6">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language6">
							Arabic
						</label>
					</div>
					<div class="form-check change-lan-sec border-bottom1">
						<input class="form-check-input custom-input" name="language" type="radio" id="language7">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language7">
							Bengali
						</label>
					</div>
					<div class="form-check change-lan-sec border-bottom1">
						<input class="form-check-input custom-input" name="language" type="radio" id="language8">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language8">
							Russian
						</label>
					</div>
					<div class="form-check change-lan-sec pb-0">
						<input class="form-check-input custom-input" name="language" type="radio" id="language9">
						<label class="form-check-label custom-lable sm-font-sans fw-500" for="language9">
							Chinese
						</label>
					</div>
				</div>
			</div>
		</div>
		<!-- Language screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
