<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">Security</p>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Security screen start -->
		<div class="verify-email pb-20" id="security-main">
			<div class="container">
				<div class="verify-number-content">
					<h1 class="d-none">Security</h1>
					<div class="notification-setting">
						<div class="notification-option-wrap border-bottom1">
							<div class="notification-option-wrapper">
								<div class="notification-option-name">
									<p>Remember Me</p>
								</div>
								<div class="notification-option-switch">
									<label class="switch" for="switch1">
										<input type="checkbox" id="switch1" checked>
										<span class="slider "></span>
									</label>
								</div>
							</div>
						</div>
						<div class="notification-option-wrap border-bottom1">
							<div class="notification-option-wrapper">
								<div class="notification-option-name">
									<p>Biometric ID</p>
								</div>
								<div class="notification-option-switch">
									<label class="switch" for="switch2">
										<input type="checkbox" id="switch2" checked>
										<span class="slider "></span>
									</label>
								</div>
							</div>
						</div>
						<div class="notification-option-wrap border-bottom1">
							<div class="notification-option-wrapper">
								<div class="notification-option-name">
									<p>Face ID</p>
								</div>
								<div class="notification-option-switch">
									<label class="switch" for="switch3">
										<input type="checkbox" id="switch3">
										<span class="slider "></span>
									</label>
								</div>
							</div>
						</div>
						<div class="notification-option-wrap border-0">
							<div class="notification-option-wrapper">
								<div class="notification-option-name">
									<p>Two-Factor Authentication</p>
								</div>
								<div class="notification-option-switch">
									<label class="switch" for="switch4">
										<input type="checkbox" id="switch4" checked>
										<span class="slider "></span>
									</label>
								</div>
							</div>
						</div>
						<div class="change-password-btn mt-24"><a href="secure-account.html">Change Password</a></div>	
					</div>
				</div>
			</div>
		</div>
		<!-- Security screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
