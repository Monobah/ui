<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">Verify email address</p>
				</div>
			</div>
		</header>
		<!-- Header end  -->
		<!-- Verify email address screen start -->
		<div class="verify-email" id="verify-email-main">
			<div class="container">
				<div class="verify-email-content mt-16">
					<h1 class="d-none">Verify Email Address</h1>
					<div class="verify-email-img-sec text-center">
						<div class="main-img-top">
							<img src="assets/images/main-img/verify-email-address-img.png" alt="notification-img">
						</div>
						<div class="main-img-bottom">
							<img src="assets/images/homescreen/bottom.png" alt="notification-img">
						</div>
					</div>
					<div class="contact-txt mt-32">
						<p class="sm-font-sans fw-400 text-center mt-12">Please enter the verification code we sent to your email address jess****@mail.com
						</p>
					</div>
					<form class="mt-24">
						<div class="digit-group otp-section" id="otp" data-autosubmit="false">
							<input type="text" id="digit-1" data-next="digit-2" autocomplete="off" value="5">
							<input type="text" id="digit-2" data-previous="digit-1" data-next="digit-3">
							<input type="text" id="digit-3" data-previous="digit-2" data-next="digit-4">
							<input type="text" id="digit-4" data-previous="digit-3">
						</div>
					</form>
					<div class="finger-print-bottom">
						<div><p class="md-font-sans fw-400 text-center">Not yet get?  <a href="verify-email-address.html" class="md-font-sans fw-500 color-black text-center">Resend OTP</a></p>
						</div>
						<div class="verify-number-btn mt-24"><a href="notification-allow.html">verify</a></div>
					</div> 
				</div>
			</div>
		</div>
		<!-- Verify email address screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
