<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!--Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">Secure your account</p>
				</div>
			</div>
		</header>
		<!--Header end -->
		<!-- Secure Account screen start -->
		<div class="verify-email pb-100" id="reset-password-main">
			<div class="container">
				<div class="verify-email-content mt-16">
					<h1 class="d-none">Secure account</h1>
					<div class="verify-email-img-sec text-center">
						<div class="main-img-top">
							<img src="assets/images/main-img/secure-img.png" alt="notification-img">
						</div>
						<div class="main-img-bottom">
							<img src="assets/images/homescreen/bottom.png" alt="notification-img">
						</div>
					</div>
					<div class="contact-txt mt-32">
						<p class="sm-font-sans fw-400 text-center mt-12">Almost there! Create a new password for your Vigor account to keep it secure. Remember to choose a strong and unique password.
						</p>
					</div>
					<form class="select-account-from mt-24">
						<div class="form-details-sign-in border mt-8">
							<span>
								<img src="assets/svg/password-icon.svg" alt="mail-icon">
							</span>
							<input type="password" id="password" value="fitness@123" placeholder="Password" class="sign-in-custom-input md-font-sans color-black fw-400">
							<i class="fas fa-eye-slash" id="eye"></i>
						</div>
						<div class="form-details-sign-in border mt-8">
							<span>
								<img src="assets/svg/password-icon.svg" alt="mail-icon">
							</span>
							<input type="password" id="confirm-new-password" placeholder="Confirm New Password" class="sign-in-custom-input md-font-sans color-black fw-400">
							<i class="fas fa-eye-slash" id="eye1"></i>
						</div>
					</form>
					<div class="password-btn bottom-fixed">
						<a href="select-gender.html">Save new password</a>
					</div>
				</div>
			</div>
		</div>
		<!-- Secure Account screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
