<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">WORKOUT PREFERENCES</p>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Workout preference screen start -->
		<div class="verify-email pb-20" id="workout-preference-main">
			<div class="container">
				<div class="workout-preference-content">
					<h1 class="d-none">Hidden</h1>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Gender</p>
						</div>
						<div class="workout-time">
							<p>Man</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Workout Focus Area</p>
						</div>
						<div class="workout-time">
							<p>Full Body</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Age</p>
						</div>
						<div class="workout-time">
							<p>28 years</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Height</p>
						</div>
						<div class="workout-time">
							<p>185 cm</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Weight</p>
						</div>
						<div class="workout-time">
							<p>76 kg</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Weekly Workout Plan</p>
						</div>
						<div class="workout-time">
							<p>4 days</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Training Rest</p>
						</div>
						<div class="workout-time">
							<p>20 secs</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Countdown Time</p>
						</div>
						<div class="workout-time">
							<p>10 secs</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Sound Options</p>
						</div>
						<div class="workout-time">

						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Weight Unit</p>
						</div>
						<div class="workout-time">
							<p>kg</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Height Unit</p>
						</div>
						<div class="workout-time">
							<p>cm</p>
						</div>
						<div class="workout-btn">
							<a href="#"><img src="assets/svg/right-arrow.svg" alt="right-arrow"></a>
						</div>
					</div>
					<div class="workout-preference-first border-bottom1">
						<div class="workout-type">
							<p>Remind me to Workout</p>
						</div>
						<div class="workout-time">
						</div>
						<div class="workout-btn">
							<div class="notification-option-switch">
								<label class="switch" for="switch4">
									<input type="checkbox" id="switch4" checked>
									<span class="slider "></span>
								</label>
							</div>
						</div>
					</div>
					<div class="workout-preference-first">
						<div class="workout-type">
							<p>Keep the Screen On</p>
						</div>
						<div class="workout-time">
						</div>
						<div class="workout-btn">
							<div class="notification-option-switch">
								<label class="switch" for="switch5">
									<input type="checkbox" id="switch5" checked>
									<span class="slider "></span>
								</label>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- Workout preference screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
