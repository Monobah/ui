<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!--Header start -->
		<header id="top-header" class="border-0">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
			</div>
		</header>
		<!--Header end -->
		<!-- Personalized plan screen start -->
		<div class="verify-email pb-100" id="personalized-plan-main">
			<div class="container">
				<div class="personalized-plan">
					<div class="first-focus-content p-0 mt-24">
						<h1>Creating personalized workout plan for you</h1>
						<p class="sm-font-sans fw-400 text-center mt-12">Please Wait...</p>
					</div>
					<div class="circle_percent" data-percent="67">
						<div class="circle_inner">
							<div class="round_per"></div>
						</div>
					</div>
					<div class="multistep-form-btn">
						<p class="sm-font-sans fw-400 text-center">This will just take a moment. Get ready to transform your fitness journey!</p>
					</div>
				</div>
			</div>
		</div>
		<!-- Personalized plan screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
