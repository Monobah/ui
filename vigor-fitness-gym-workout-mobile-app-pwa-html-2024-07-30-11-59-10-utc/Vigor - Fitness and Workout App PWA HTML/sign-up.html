<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header" class="border-0">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Sign up screen start -->
		<div class="verify-email pb-80" id="sign-up-main">
			<div class="container">
				<div class="let-you-middle-wrap">
					<div class="middle-first mt-24 text-center">
						<img src="assets/images/splashscreen/small-logo.png" alt="logo" >
						<h1 class="md-font-zen fw-400 mt-24">create account</h1>
						<p class="sm-font-sans fw-400 mt-12">Sign up now to get access to personalized workouts and achieve your fitness goals.</p>
					</div>
					<form class="mt-32">
						<div class="form-details-sign-in border">
							<span>
								<img src="assets/svg/mail-icon.svg" alt="mail-icon">
							</span>
							<input type="email" id="email" value="jessica.smith@mail.com" class="sign-in-custom-input md-font-sans color-black fw-400" autocomplete="off">
						</div>
						<div class="form-details-sign-in border mt-8">
							<span>
								<img src="assets/svg/password-icon.svg" alt="mail-icon">
							</span>
							<input type="password" id="password" value="fitness@123" class="sign-in-custom-input md-font-sans color-black fw-400">
							<i class="fas fa-eye-slash" id="eye"></i>
						</div>
					</form>
					<div class="password-btn mt-16">
						<a href="verify-email-address.html">Sign up</a>
					</div>
					<footer id="let-you-footer">
						<div class="block-footer">
							<p class="md-font-sans fw-400 text-center">Already have an account? <a href="sign-in.html" class="md-font-sans fw-500 color-black text-center">Sign In</a></p>
						</div>
					</footer>
				</div>
			</div>
		</div>
		<!-- Sign up screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
