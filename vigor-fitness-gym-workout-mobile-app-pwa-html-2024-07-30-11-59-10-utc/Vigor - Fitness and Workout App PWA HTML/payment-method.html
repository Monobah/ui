<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">SELECT PAYMENT METHOD</p>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Payment method screen start -->
		<div class="verify-email pb-100" id="payment-method-main">
			<div class="container">
				<div class="payment-method-wrap">
					<h1 class="d-none">Hidden</h1>
					<div class="delete-account-bottom border-bottom1">
						<div class="bank-img">
							<img src="assets/images/payment/payment1.png" alt="bank-icon">
						</div>
						<div class="bank-details">
							<h2>Bank of America</h2>
							<div class="bank-card">
								<span>Active </span>
								<span>| Card Number **** 4625</span>
							</div>
						</div>
						<div class="delete-select">
							<input class="form-check-input" type="radio" name="shipping" id="shipping1" value="shipping1">
						</div>
					</div>
					<div class="delete-account-bottom border-bottom1">
						<div class="bank-img">
							<img src="assets/images/payment/payment2.png" alt="bank-icon">
						</div>
						<div class="bank-details">
							<h2>MasterCard</h2>
							<div class="bank-card">
								<span>Active </span>
								<span>| Card Number **** 7887</span>
							</div>
						</div>
						<div class="delete-select">
							<input class="form-check-input" type="radio" name="shipping" id="shipping2" value="shipping2" checked>
						</div>
					</div>
					<div class="delete-account-bottom border-bottom1">
						<div class="bank-img">
							<img src="assets/images/payment/payment3.png" alt="bank-icon">
						</div>
						<div class="bank-details">
							<h2>Visa</h2>
							<div class="bank-card">
								<span>Inactive </span>
								<span>| Card Number **** 2540</span>
							</div>
						</div>
						<div class="delete-select">
							<input class="form-check-input" type="radio" name="shipping" id="shipping3" value="shipping3">
						</div>
					</div>
					<div class="delete-account-bottom border-bottom1">
						<div class="bank-img">
							<img src="assets/images/payment/payment1.png" alt="bank-icon">
						</div>
						<div class="bank-details">
							<h2>JPMorgan Bank</h2>
							<div class="bank-card">
								<span>Inactive </span>
								<span>| Card Number **** 2540</span>
							</div>
						</div>
						<div class="delete-select">
							<input class="form-check-input" type="radio" name="shipping" id="shipping4" value="shipping4">
						</div>
					</div>
					<div class="verify-number-btn payment-btn mt-24"><a href="add-new-card.html"><span><img src="assets/svg/faq-plus.svg" alt="plus-icon"></span>Link a New Card</a></div>
					<div class="password-btn bottom-fixed bottom-fixed1">
						<a href="account-upgrade-processing.html">CONTINUE</a>
					</div>
				</div>
			</div>
		</div>
		<!-- Payment method screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
