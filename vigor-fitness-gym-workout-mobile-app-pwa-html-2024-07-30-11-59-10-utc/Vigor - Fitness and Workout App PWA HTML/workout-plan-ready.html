<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header" class="border-0">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Workout plan screen start -->
		<div class="verify-email pb-100" id="workout-plan-ready">
			<div class="container">
				<div class="workout-plan-ready-wrap">
					<div class="first-focus-content mt-24">
						<h1>Your Workout plan is ready!</h1>
						<h2 class="d-none">Workout plan</h2>
						<p class="sm-font-sans fw-400 text-center mt-12">Your personalized workout plan has been generated based on your goals & fitness level.</p>
					</div>
					<div class="workout-plan-ready-content mt-24">
						<div class="verify-email-img-sec text-center">
							<div class="main-img-top">
								<img src="assets/images/main-img/workout-plan-ready.png" alt="notification-img">
							</div>
							<div class="main-img-bottom">
								<img src="assets/images/homescreen/bottom.png" alt="notification-img">
							</div>
							<div class="workout-plan-ready-details">
								<h3 class="md-font-sans fw-700 color-green">Full Body Stretching</h3>
								<p>20 mins  |  Intermediate</p>
							</div>
						</div>
					</div>
					<div class="multistep-form-btn">
						<div class="skip-btn-form">
							<a href="homescreen.html">Go Home</a>
						</div>
						<div class="continue-btn-form">
							<a href="homescreen.html" class="text-white">Let’s Go!</a>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- Workout plan screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
