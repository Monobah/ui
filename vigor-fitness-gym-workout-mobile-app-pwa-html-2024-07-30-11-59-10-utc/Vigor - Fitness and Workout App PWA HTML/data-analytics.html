<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vigor - Fitness & Workout App PWA HTML</title>
	<link rel="icon" href="assets/images/favicon/icon.png">
	<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/all.min.css">
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<link rel="stylesheet" href="assets/css/media-query.css">
</head>
<body>
	<div class="site-content">
		<!-- Preloader start -->
		<div class="preloader">
			<img src="assets/images/favicon/preloader.gif" alt="preloader">
		</div>
		<!-- Preloader end -->
		<!-- Header start -->
		<header id="top-header">
			<div class="header-wrap">
				<div class="header-back">
					<a href="javascript:history.go(-1)">
						<img src="assets/svg/black-left-arrow.svg" alt="back-btn-icon">
					</a>
				</div>
				<div class="header-name">
					<p class="sm-font-zen fw-400">Data & Analytics</p>
				</div>
			</div>
		</header>
		<!-- Header end -->
		<!-- Data analytics screen start -->
		<div class="verify-email pb-20" id="data-analytics-main">
			<div class="container">
				<div class="data-analytics-content">
					<h1 class="d-none">Data Analytics</h1>
					<div class="data-analytics-first border-bottom2">
						<div class="data-details">
							<h2>Data Usage</h2>
							<p class="mt-8">Control how your data is used for analytics. Customize your preferences.</p>
						</div>
						<div class="data-btn">
							<a href="javascript:void(0)">
								<img src="assets/svg/right-arrow.svg" alt="right-arrow">
							</a>
						</div>
					</div>
					<div class="data-analytics-first border-bottom2">
						<div class="data-details">
							<h2>Ad Preferences</h2>
							<p class="mt-8">Manage ad personalization settings. Tailor your ad experience.</p>
						</div>
						<div class="data-btn">
							<a href="javascript:void(0)">
								<img src="assets/svg/right-arrow.svg" alt="right-arrow">
							</a>
						</div>
					</div>
					<div class="data-analytics-first">
						<div class="data-details">
							<h2>Download My Data</h2>
							<p class="mt-8">Request a copy of your data. Your information, your control.</p>
						</div>
						<div class="data-btn">
							<a href="javascript:void(0)">
								<img src="assets/svg/right-arrow.svg" alt="right-arrow">
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- Data analytics screen end -->
	</div>
	<script src="assets/js/jquery.min.js"></script>
	<script src="assets/js/bootstrap.bundle.min.js"></script>
	<script src="assets/js/custom.js"></script>
</body>
</html>
